name: vitrin_client
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_html: ^3.0.0
  webview_flutter: ^4.13.0
  # Pinned: flutter_html 3.0.0 reaches into html's internal (non-exported)
  # query_selector.dart for a top-level `matches()` function that was
  # removed in 0.15.7, which breaks the build ("Method not found: matches").
  # Keep this below 0.15.7 until flutter_html is updated to match.
  html: 0.15.6
  socket_io_client: ^2.0.3+1
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Peyda
      fonts:
        - asset: assets/Peyda-Regular.ttf
          weight: 400
        - asset: assets/Peyda-Bold.ttf
          weight: 700
        - asset: assets/Peyda-Black.ttf
          weight: 900
