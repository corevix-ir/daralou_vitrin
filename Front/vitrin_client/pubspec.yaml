name: vitrin_client
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Peyda
      fonts:
        - asset: assets/Peyda-Regular.ttf
          weight: 400
        - asset: assets/Peyda-Bold.ttf
          weight: 700
        - asset: assets/Peyda-Black.ttf
          weight: 900
